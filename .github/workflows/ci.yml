name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Only Node 24 is claimed by engines and only Node 24 has been verified.
      # A second version would be a promise nobody has tested.
      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: npm

      - run: npm ci
      - name: Typecheck
        run: npm run check
      - name: Tests
        run: npm test
      - name: Offline demo (the product surface must keep working)
        run: npm run demo
